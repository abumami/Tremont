<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hebrew / Civil Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');

  :root{
    --paper: #F6F3EC;
    --paper-cell: #FDFCF9;
    --ink: #2B2A28;
    --ink-soft: #6B6559;
    --rule: #DCD5C6;
    --rule-strong: #C9C0AC;
    --civil: #92562E;
    --civil-soft: #C98F62;
    --hebrew: #2C4A73;
    --hebrew-soft: #6D8CB2;
    --holiday-bg: #EFE3D0;
    --holiday-text: #7A4A1E;
    --parsha-bg: #E4EAE3;
    --parsha-text: #3C5C46;
    --omer-text: #8A7E5E;
    --today-ring: #B14A34;
    --shabbat-bg: #EEF1EC;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--rule-strong);
    padding-bottom: 16px;
  }

  .titles{ line-height:1.15; }
  .civil-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--civil);
    margin: 0;
  }
  .hebrew-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: 17px;
    color: var(--hebrew);
    margin: 4px 0 0;
    letter-spacing: 0.01em;
  }

  nav{ display:flex; align-items:center; gap: 10px; }
  .nav-btn{
    border: 1px solid var(--rule-strong);
    background: var(--paper-cell);
    color: var(--ink);
    width: 34px; height: 34px;
    border-radius: 3px;
    font-size: 16px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    font-family: inherit;
  }
  .nav-btn:hover{ border-color: var(--civil); color: var(--civil); }
  .today-btn, .lang-btn{
    border: 1px solid var(--rule-strong);
    background: var(--paper-cell);
    padding: 0 14px; height: 34px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-soft);
    font-family: 'Source Serif 4', serif;
  }
  .today-btn:hover, .lang-btn:hover{ color: var(--civil); border-color: var(--civil); }
  .lang-btn{ color: var(--hebrew); border-color: var(--hebrew-soft); }

  .weekdays{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .weekdays div{
    text-align:center;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    padding: 4px 0 8px;
    font-family: 'Source Serif 4', serif;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(120px, auto);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .cell{
    background: var(--paper-cell);
    position: relative;
    padding: 6px 7px 8px;
    display:flex;
    flex-direction:column;
    cursor: pointer;
    min-height: 120px;
  }
  .cell.pad{ background: #F1EDE3; }
  .cell.pad .civil-num, .cell.pad .hebrew-num{ opacity: 0.35; }
  .cell.shabbat{ background: var(--shabbat-bg); }
  .cell:hover{ outline: 1px solid var(--civil-soft); outline-offset: -1px; }

  .cell-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 6px;
  }
  .civil-num{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--civil);
  }
  .hebrew-num{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--hebrew);
    text-align: right;
    white-space: nowrap;
  }

  .today .civil-num{
    box-shadow: 0 0 0 2px var(--today-ring);
    border-radius: 50%;
    width: 24px; height: 24px;
    display:flex; align-items:center; justify-content:center;
  }

  .cell-body{
    margin-top: 6px;
    flex: 1;
    display:flex;
    flex-direction:column;
    gap: 3px;
    overflow: hidden;
  }

  .holiday-tag{
    font-size: 10.5px;
    line-height: 1.25;
    color: var(--holiday-text);
    background: var(--holiday-bg);
    border-radius: 2px;
    padding: 1px 5px;
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    display: inline-block;
    max-width: 100%;
  }

  .parsha-tag{
    font-size: 10.5px;
    line-height: 1.25;
    color: var(--parsha-text);
    background: var(--parsha-bg);
    border-radius: 2px;
    padding: 1px 5px;
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    display: inline-block;
    max-width: 100%;
  }

  .omer-tag{
    font-size: 10px;
    line-height: 1.2;
    color: var(--omer-text);
    font-style: italic;
  }

  .note-text{
    font-size: 11px;
    line-height: 1.3;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .note-input{
    width: 100%;
    height: 100%;
    resize: none;
    border: none;
    background: transparent;
    font-family: 'Source Serif 4', serif;
    font-size: 11px;
    line-height: 1.3;
    color: var(--ink);
    padding: 0;
  }
  .note-input:focus{ outline: none; }

  .legend{
    display:flex;
    gap: 22px;
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-soft);
    align-items:center;
    flex-wrap: wrap;
  }
  .legend span.dot{
    display:inline-block; width:9px; height:9px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .legend .civil-dot{ background: var(--civil); }
  .legend .hebrew-dot{ background: var(--hebrew); }
  .legend .holiday-dot{ background: var(--holiday-text); }
  .legend .parsha-dot{ background: var(--parsha-text); }

  .save-note{ font-size: 11px; color: var(--ink-soft); }

  [dir="rtl"]{ direction: rtl; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1 class="civil-title" id="civilTitle"></h1>
      <p class="hebrew-title" id="hebrewTitle"></p>
    </div>
    <nav>
      <button class="lang-btn" id="locBtn">Israel</button>
      <button class="lang-btn" id="langBtn">עברית</button>
      <button class="nav-btn" id="prevBtn" aria-label="Previous month">&#8249;</button>
      <button class="today-btn" id="todayBtn">Today</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next month">&#8250;</button>
    </nav>
  </header>

  <div class="weekdays" id="weekdays"></div>

  <div class="grid" id="grid"></div>

  <div class="legend">
    <div><span class="dot civil-dot"></span><span id="legendCivil"></span></div>
    <div><span class="dot hebrew-dot"></span><span id="legendHebrew"></span></div>
    <div><span class="dot parsha-dot"></span><span id="legendParsha"></span></div>
    <div><span class="dot holiday-dot"></span><span id="legendHoliday"></span></div>
    <div class="save-note" id="saveNote"></div>
  </div>
</div>

<script>
(function(){
  const grid = document.getElementById('grid');
  const civilTitle = document.getElementById('civilTitle');
  const hebrewTitle = document.getElementById('hebrewTitle');
  const saveNote = document.getElementById('saveNote');
  const weekdaysEl = document.getElementById('weekdays');
  const langBtn = document.getElementById('langBtn');
  const todayBtn = document.getElementById('todayBtn');
  const locBtn = document.getElementById('locBtn');

  // ================= i18n =================
  const MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTH_NAMES_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const WEEKDAYS_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const WEEKDAYS_HE = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];

  const STRINGS = {
    en: {
      today: 'Today', langToggle: 'עברית',
      addNote: 'Add a note or event…', saved: 'Saved', couldNotSave: 'Could not save',
      legendCivil: 'Civil date', legendHebrew: 'Hebrew date',
      legendParsha: 'Torah portion (Shabbat)',
      legendHoliday: 'Holiday (approximate — verify for observance)',
      omer: (n) => 'Omer, day ' + n,
      locDiaspora: 'Diaspora', locIsrael: 'Israel',
      parshatPrefix: 'Parashat '
    },
    he: {
      today: 'היום', langToggle: 'English',
      addNote: 'הוסף הערה או אירוע…', saved: 'נשמר', couldNotSave: 'לא ניתן לשמור',
      legendCivil: 'תאריך אזרחי', legendHebrew: 'תאריך עברי',
      legendParsha: 'פרשת השבוע',
      legendHoliday: 'חג (יש לוודא זמנים/תאריכים מדויקים)',
      omer: (n) => 'העומר, יום ' + n,
      locDiaspora: 'תפוצות', locIsrael: 'ישראל',
      parshatPrefix: 'פרשת '
    }
  };

  // 54 weekly Torah portions, in reading order (Vezot HaBerakhah is read on
  // Simchat Torah itself, never on a regular Shabbat, but is kept in the list
  // for indexing purposes).
  const PARSHA_EN = ['Bereshit','Noach','Lech Lecha','Vayera',"Chayei Sara",'Toldot','Vayetzei','Vayishlach',
    'Vayeshev','Miketz','Vayigash','Vayechi','Shemot','Vaera','Bo','Beshalach','Yitro','Mishpatim','Terumah',
    'Tetzaveh','Ki Tisa','Vayakhel','Pekudei','Vayikra','Tzav','Shmini','Tazria','Metzora','Achrei Mot',
    'Kedoshim','Emor','Behar','Bechukotai','Bamidbar','Nasso',"Beha'alotcha","Sh'lach",'Korach','Chukat',
    'Balak','Pinchas','Matot','Masei','Devarim',"Va'etchanan",'Eikev','Re\u2019eh','Shoftim','Ki Teitzei',
    'Ki Tavo','Nitzavim','Vayelech',"Ha'azinu",'Vezot HaBerakhah'];
  const PARSHA_HE = ['בראשית','נח','לך לך','וירא','חיי שרה','תולדות','ויצא','וישלח','וישב','מקץ','ויגש','ויחי',
    'שמות','וארא','בא','בשלח','יתרו','משפטים','תרומה','תצוה','כי תשא','ויקהל','פקודי','ויקרא','צו','שמיני',
    'תזריע','מצורע','אחרי מות','קדושים','אמור','בהר','בחוקותי','במדבר','נשא','בהעלותך','שלח','קרח','חוקת',
    'בלק','פינחס','מטות','מסעי','דברים','ואתחנן','עקב','ראה','שופטים','כי תצא','כי תבוא','נצבים','וילך',
    'האזינו','וזאת הברכה'];

  // ================= Hebrew-date helpers =================
  const hebFmtEnCache = new Intl.DateTimeFormat('en-u-ca-hebrew', { year:'numeric', month:'long', day:'numeric' });
  const hebFmtHeCache = new Intl.DateTimeFormat('he-u-ca-hebrew-nu-hebr', { year:'numeric', month:'long', day:'numeric' });

  function hebrewPartsEn(date){
    const parts = hebFmtEnCache.formatToParts(date);
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return { day: parseInt(map.day,10), month: map.month, year: parseInt(map.year,10) };
  }
  function hebrewPartsDisplay(date, lang){
    const fmt = lang === 'he' ? hebFmtHeCache : hebFmtEnCache;
    const parts = fmt.formatToParts(date);
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return { day: map.day, month: map.month, year: map.year };
  }

  function isoKey(date){
    return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
  }
  function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
  function daysBetween(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }

  function findNextHebrewDate(monthName, day, refDate, radius){
    for (let o=1; o<=radius; o++){
      const d = addDays(refDate, o);
      const hp = hebrewPartsEn(d);
      if (hp.month === monthName && hp.day === day) return d;
    }
    return null;
  }
  function findPriorHebrewDate(monthName, day, refDate, radius){
    for (let o=1; o<=radius; o++){
      const d = addDays(refDate, -o);
      const hp = hebrewPartsEn(d);
      if (hp.month === monthName && hp.day === day) return d;
    }
    return null;
  }

  // Anchor-based multi-day spans (robust to Kislev's variable length etc.)
  function findAnchorNearby(monthName, day, refDate, radius){
    for (let o=0; o<=radius; o++){
      for (const sign of (o===0?[1]:[-1,1])){
        const d = addDays(refDate, sign*o);
        const hp = hebrewPartsEn(d);
        if (hp.month === monthName && hp.day === day) return d;
      }
    }
    return null;
  }

  // ================= Offline holiday lookup =================
  function holidayFor(date, israel, lang){
    const hp = hebrewPartsEn(date);
    const m = hp.month, day = hp.day;
    const L = (en, he) => lang === 'he' ? he : en;
    if (m === 'Tishrei'){
      if (day===1||day===2) return L('Rosh Hashanah','ראש השנה');
      if (day===3) return L('Fast of Gedaliah','צום גדליה');
      if (day===10) return L('Yom Kippur','יום כיפור');
      if (day===15||day===16) return L('Sukkot','סוכות');
      if (day>=17&&day<=20) return L('Chol HaMoed Sukkot','חול המועד סוכות');
      if (day===21) return L('Hoshana Rabbah','הושענא רבה');
      if (day===22) return israel ? L('Shemini Atzeret / Simchat Torah','שמיני עצרת ושמחת תורה') : L('Shemini Atzeret','שמיני עצרת');
      if (day===23 && !israel) return L('Simchat Torah','שמחת תורה');
    }
    if (m === 'Tevet' && day===10) return L("Asara B'Tevet (fast)",'עשרה בטבת');
    if (m === 'Shevat' && day===15) return L('Tu BiShvat','ט״ו בשבט');
    if (m === 'Adar' || m === 'Adar II'){
      if (day===13) return L("Ta'anit Esther (fast)",'תענית אסתר');
      if (day===14) return L('Purim','פורים');
      if (day===15) return L('Shushan Purim','שושן פורים');
    }
    if (m === 'Nisan'){
      if (day===14) return L('Erev Pesach','ערב פסח');
      if (day===15||day===16) return L('Pesach','פסח');
      if (day>=17&&day<=20) return L('Chol HaMoed Pesach','חול המועד פסח');
      if (day===21) return L('Pesach','פסח');
      if (day===22 && !israel) return L('Pesach','פסח');
      if (day===27) return L('Yom HaShoah','יום השואה');
    }
    if (m === 'Iyar'){
      if (day===5) return L('Yom HaAtzmaut*','יום העצמאות*');
      if (day===18) return L('Lag BaOmer','ל״ג בעומר');
      if (day===28) return L('Yom Yerushalayim','יום ירושלים');
    }
    if (m === 'Sivan'){
      if (day===6) return L('Shavuot','שבועות');
      if (day===7 && !israel) return L('Shavuot','שבועות');
    }
    if (m === 'Tamuz' && day===17) return L('Tzom Tammuz (fast)','צום תמוז');
    if (m === 'Av'){
      if (day===9) return L("Tisha B'Av (fast)",'תשעה באב');
      if (day===15) return L("Tu B'Av",'ט״ו באב');
    }
    return null;
  }

  // ================= Local parasha (Torah portion) engine =================
  // Implements the standard deterministic algorithm for which portions are
  // combined, based on: I. Bromberg, "Weekly Torah Portions and Special
  // Sabbaths" (individual.utoronto.ca/kalendis/hebrew/parshah.htm).
  function isOverriddenShabbat(d, israel){
    const hp = hebrewPartsEn(d);
    const m = hp.month, day = hp.day;
    if (m === 'Tishrei'){
      if (day===1||day===2) return true;
      if (day===10) return true;
      if (day>=15 && day<=22) return true;
      if (!israel && day===23) return true;
    }
    if (m === 'Nisan'){
      if (day>=15 && day<=21) return true;
      if (!israel && day===22) return true;
    }
    if (m === 'Sivan'){
      if (day===6) return true;
      if (!israel && day===7) return true;
    }
    return false;
  }

  function cycleIsLeap(simchatTorahDate){
    for (let o=90; o<=210; o++){
      const d = addDays(simchatTorahDate, o);
      const hp = hebrewPartsEn(d);
      if (hp.month === 'Adar I') return true;
      if (hp.month === 'Adar') return false;
    }
    return false;
  }

  function countSaturdaysInclusive(start, end){
    let count = 0;
    for (let d = new Date(start); d.getTime() <= end.getTime(); d = addDays(d,7)) count++;
    return count;
  }

  const parshaCache = new Map();
  function computeParsha(targetSaturday, israel){
    if (targetSaturday.getDay() !== 6) return null;
    const cacheKey = isoKey(targetSaturday) + '_' + (israel?'il':'d');
    if (parshaCache.has(cacheKey)) return parshaCache.get(cacheKey);

    const stDay = israel ? 22 : 23;
    const simchatTorah = findPriorHebrewDate('Tishrei', stDay, targetSaturday, 400);
    let result = null;

    if (simchatTorah && !isOverriddenShabbat(targetSaturday, israel)){
      let bereshitShabbat = addDays(simchatTorah, 1);
      while (bereshitShabbat.getDay() !== 6) bereshitShabbat = addDays(bereshitShabbat, 1);

      if (targetSaturday.getTime() === bereshitShabbat.getTime()){
        result = { indices: [0] };
      } else {
        const weeksElapsed = Math.round(daysBetween(bereshitShabbat, targetSaturday) / 7);
        const pnSimple = weeksElapsed + 1;
        if (pnSimple >= 1 && pnSimple < 22){
          result = { indices: [pnSimple - 1] };
        } else {
          const leap = cycleIsLeap(simchatTorah);
          const pesach = findNextHebrewDate('Nisan', 15, simchatTorah, 260);
          const tishaBav = findNextHebrewDate('Av', 9, simchatTorah, 340);
          const nextRoshHashanah = findNextHebrewDate('Tishrei', 1, simchatTorah, 400);

          let tempShabbat = addDays(bereshitShabbat, 20*7);
          let pn = 21;
          let lastCombined = false;

          while (tempShabbat.getTime() < targetSaturday.getTime()){
            tempShabbat = addDays(tempShabbat, 7);
            if (isOverriddenShabbat(tempShabbat, israel)) continue;
            pn += 1;
            let combined = false;
            if (pesach && tishaBav && nextRoshHashanah){
              switch (pn){
                case 22: {
                  const upper = addDays(pesach, -1);
                  combined = countSaturdaysInclusive(tempShabbat, upper) < 4;
                  break;
                }
                case 27: combined = !leap; break;
                case 29: combined = !leap; break;
                case 32: {
                  if (!israel) combined = !leap;
                  else combined = (pesach.getDay() !== 6) && !leap;
                  break;
                }
                case 39: {
                  combined = !israel && pesach.getDay() === 4;
                  break;
                }
                case 42: {
                  combined = countSaturdaysInclusive(tempShabbat, tishaBav) < 3;
                  break;
                }
                case 51: {
                  combined = daysBetween(tempShabbat, nextRoshHashanah) > 3;
                  break;
                }
              }
            }
            if (combined) pn += 1;
            lastCombined = combined;
          }

          if (tempShabbat.getTime() === targetSaturday.getTime() && pn >= 1 && pn <= 54){
            result = lastCombined ? { indices: [pn-2, pn-1] } : { indices: [pn-1] };
          }
        }
      }
    }
    parshaCache.set(cacheKey, result);
    return result;
  }

  // Chanukah + Omer: 8/49 consecutive civil days from a fixed Hebrew anchor,
  // which sidesteps needing to know Kislev's variable month length.
  function buildSpanMap(monthName, day, length, refDate){
    const anchor = findAnchorNearby(monthName, day, refDate, 200);
    const map = {};
    if (anchor){
      for (let i=0;i<length;i++) map[isoKey(addDays(anchor,i))] = i+1;
    }
    return map;
  }

  // ================= Notes storage =================
  const notesCache = {};
  async function loadNote(key){
    if (key in notesCache) return notesCache[key];
    try{
      const res = await window.storage.get('note:' + key);
      notesCache[key] = res ? res.value : '';
    }catch(e){ notesCache[key] = ''; }
    return notesCache[key];
  }
  async function saveNoteFor(key, value){
    notesCache[key] = value;
    const S = STRINGS[lang];
    try{
      if (value && value.trim().length) await window.storage.set('note:' + key, value);
      else await window.storage.delete('note:' + key);
      saveNote.textContent = S.saved;
      setTimeout(()=>{ saveNote.textContent=''; }, 1200);
    }catch(e){
      saveNote.textContent = S.couldNotSave;
      setTimeout(()=>{ saveNote.textContent=''; }, 1500);
    }
  }

  // ================= State =================
  const today = new Date();
  today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let lang = 'en';
  let israel = false;

  function applyStaticStrings(){
    const S = STRINGS[lang];
    todayBtn.textContent = S.today;
    langBtn.textContent = S.langToggle;
    locBtn.textContent = israel ? S.locDiaspora : S.locIsrael;
    document.getElementById('legendCivil').textContent = S.legendCivil;
    document.getElementById('legendHebrew').textContent = S.legendHebrew;
    document.getElementById('legendParsha').textContent = S.legendParsha;
    document.getElementById('legendHoliday').textContent = S.legendHoliday;

    weekdaysEl.innerHTML = '';
    const names = lang === 'he' ? WEEKDAYS_HE : WEEKDAYS_EN;
    names.forEach(n => {
      const div = document.createElement('div');
      div.textContent = n;
      weekdaysEl.appendChild(div);
    });
  }

  function render(){
    applyStaticStrings();
    grid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const lastOfMonth = new Date(viewYear, viewMonth+1, 0);
    const startDow = firstOfMonth.getDay();
    const totalDaysShown = Math.ceil((startDow + lastOfMonth.getDate()) / 7) * 7;
    const gridStart = addDays(firstOfMonth, -startDow);

    civilTitle.textContent = (lang === 'he' ? MONTH_NAMES_HE[viewMonth] : MONTH_NAMES_EN[viewMonth]) + ' ' + viewYear;
    civilTitle.dir = lang === 'he' ? 'rtl' : 'ltr';

    const hStart = hebrewPartsDisplay(firstOfMonth, lang);
    const hEnd = hebrewPartsDisplay(lastOfMonth, lang);
    if (hStart.month === hEnd.month && hStart.year === hEnd.year){
      hebrewTitle.textContent = hStart.month + ' ' + hStart.year;
    } else if (hStart.year === hEnd.year){
      hebrewTitle.textContent = hStart.month + ' \u2013 ' + hEnd.month + ' ' + hEnd.year;
    } else {
      hebrewTitle.textContent = hStart.month + ' ' + hStart.year + ' \u2013 ' + hEnd.month + ' ' + hEnd.year;
    }
    hebrewTitle.dir = lang === 'he' ? 'rtl' : 'ltr';

    const chanukahMap = buildSpanMap('Kislev', 25, 8, firstOfMonth);
    const omerMap = buildSpanMap('Nisan', 16, 49, firstOfMonth);

    for (let i=0; i<totalDaysShown; i++){
      const d = addDays(gridStart, i);
      const key = isoKey(d);
      const isPad = d.getMonth() !== viewMonth;
      const isToday = d.getTime() === today.getTime();
      const isShabbat = d.getDay() === 6;

      const cell = document.createElement('div');
      cell.className = 'cell' + (isPad ? ' pad' : '') + (isToday ? ' today' : '') + (isShabbat ? ' shabbat' : '');

      const head = document.createElement('div');
      head.className = 'cell-head';

      const civilNum = document.createElement('div');
      civilNum.className = 'civil-num';
      civilNum.textContent = d.getDate();

      const hp = hebrewPartsDisplay(d, lang);
      const hebrewNum = document.createElement('div');
      hebrewNum.className = 'hebrew-num';
      hebrewNum.dir = lang === 'he' ? 'rtl' : 'ltr';
      hebrewNum.textContent = hp.day + ' ' + hp.month;

      head.appendChild(civilNum);
      head.appendChild(hebrewNum);
      cell.appendChild(head);

      const body = document.createElement('div');
      body.className = 'cell-body';

      if (omerMap[key]){
        const om = document.createElement('div');
        om.className = 'omer-tag';
        om.dir = lang === 'he' ? 'rtl' : 'ltr';
        om.textContent = STRINGS[lang].omer(omerMap[key]);
        body.appendChild(om);
      }

      if (chanukahMap[key]){
        const tag = document.createElement('div');
        tag.className = 'holiday-tag';
        tag.dir = lang === 'he' ? 'rtl' : 'ltr';
        tag.textContent = lang === 'he' ? ('חנוכה, נר ' + chanukahMap[key]) : ('Chanukah (day ' + chanukahMap[key] + ')');
        body.appendChild(tag);
      } else {
        const hLabel = holidayFor(d, israel, lang);
        if (hLabel){
          const tag = document.createElement('div');
          tag.className = 'holiday-tag';
          tag.dir = lang === 'he' ? 'rtl' : 'ltr';
          tag.textContent = hLabel;
          body.appendChild(tag);
        }
      }

      if (isShabbat){
        const p = computeParsha(d, israel);
        if (p){
          const names = p.indices.map(idx => lang === 'he' ? PARSHA_HE[idx] : PARSHA_EN[idx]);
          const tag = document.createElement('div');
          tag.className = 'parsha-tag';
          tag.dir = lang === 'he' ? 'rtl' : 'ltr';
          tag.textContent = STRINGS[lang].parshatPrefix + names.join(lang === 'he' ? '\u2013' : '-');
          body.appendChild(tag);
        }
      }

      const noteDisplay = document.createElement('div');
      noteDisplay.className = 'note-text';
      body.appendChild(noteDisplay);
      loadNote(key).then(val => { noteDisplay.textContent = val || ''; });

      cell.appendChild(body);

      cell.addEventListener('click', () => {
        if (cell.querySelector('textarea')) return;
        const textarea = document.createElement('textarea');
        textarea.className = 'note-input';
        textarea.value = notesCache[key] || '';
        textarea.placeholder = STRINGS[lang].addNote;
        noteDisplay.replaceWith(textarea);
        textarea.focus();
        const finish = () => {
          const val = textarea.value;
          saveNoteFor(key, val);
          const nd = document.createElement('div');
          nd.className = 'note-text';
          nd.textContent = val;
          textarea.replaceWith(nd);
        };
        textarea.addEventListener('blur', finish);
        textarea.addEventListener('keydown', (e) => { if (e.key === 'Escape') textarea.blur(); });
        textarea.addEventListener('click', (e) => e.stopPropagation());
      });

      grid.appendChild(cell);
    }
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth -= 1;
    if (viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth += 1;
    if (viewMonth > 11){ viewMonth = 0; viewYear += 1; }
    render();
  });
  todayBtn.addEventListener('click', () => {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    render();
  });
  langBtn.addEventListener('click', () => { lang = lang === 'en' ? 'he' : 'en'; render(); });
  locBtn.addEventListener('click', () => { israel = !israel; render(); });

  render();
})();
</script>
</body>
</html>
